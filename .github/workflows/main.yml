name: Build Blocklist          # 1. Workflow name (shown in Actions tab)

on:                            # 2. When to run
  push:
    branches: [main]
  schedule:
    - cron: "0 2 * * *"        # daily 2am UTC
  workflow_dispatch:           # manual run button

permissions:                   # 3. Permission to push
  contents: write

jobs:                          # 4. Jobs to run
  build:                       # Job ID (any name)
    runs-on: ubuntu-latest     # Runner OS

    steps:                     # 5. Steps in order
      - name: Checkout code
        uses: actions/checkout@v4   # use pre-made action

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run build
        run: |                      # run shell command
          python build.py

      - name: Push back
        run: |
          git config user.name "bot"
          git push
