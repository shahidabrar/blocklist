name: build
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: python build.py
      - uses: actions/upload-artifact@v4
        with:
          name: blocklist
          path: |
            final.txt
            final.txt.gz
            final.gz
