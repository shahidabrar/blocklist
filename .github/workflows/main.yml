name: Build ESP32-C3 Blocklist

on:
  schedule:
    # Runs daily at 00:00 UTC to fetch the latest upstream blocklists
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      output_name:
        description: 'Output binary filename'
        required: false
        default: 'blocklist.bin'
      custom_sources:
        description: 'Optional space-separated URLs/files (leave empty for DEFAULT_SOURCES)'
        required: false
        default: ''
  push:
    branches: [ "main", "master" ]
    paths:
      - 'build_blocklist.py'
      - 'scripts/build_blocklist.py'
      - '.github/workflows/build-blocklist.yml'

permissions:
  contents: write # Required to publish/update the GitHub Release asset

jobs:
  build-blob:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate FNV-1a hash blob
        id: build
        env:
          OUT_FILE: ${{ inputs.output_name || 'blocklist.bin' }}
          CUSTOM_SOURCES: ${{ inputs.custom_sources }}
        run: |
          # Locate build_blocklist.py whether it is in the root or scripts/ folder
          SCRIPT_PATH="build_blocklist.py"
          if [ ! -f "$SCRIPT_PATH" ] && [ -f "scripts/build_blocklist.py" ]; then
            SCRIPT_PATH="scripts/build_blocklist.py"
          fi

          echo "### 🛡️ ESP32-C3 Blocklist Build Summary" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY

          # Execute script and tee stdout to the GitHub Actions Job Summary
          if [ -n "$CUSTOM_SOURCES" ]; then
            # Word splitting on CUSTOM_SOURCES is intentional to pass multiple URL args
            python3 "$SCRIPT_PATH" "$OUT_FILE" $CUSTOM_SOURCES \vert{} tee -a$GITHUB_STEP_SUMMARY
          else
            python3 "$SCRIPT_PATH" "$OUT_FILE" \vert{} tee -a $GITHUB_STEP_SUMMARY
          fi

          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Verify binary size budget
        env:
          OUT_FILE: ${{ inputs.output_name || 'blocklist.bin' }}
        run: |
          if [ ! -s "$OUT_FILE" ]; then
            echo "::error::Generated $OUT_FILE is missing or empty!"
            exit 1
          fi
          SIZE=$(stat -c%s "$OUT_FILE")
          echo "Verified binary size: $SIZE bytes"
          # Warn if binary exceeds ~1.5 MB (typical dual-OTA partition ceiling on 4MB flash)
          if [ "$SIZE" -gt 1572864 ]; then
            echo "::warning::blocklist.bin ($SIZE bytes) exceeds 1.5 MB. Ensure your ESP32-C3 partition table fits this blob!"
          fi

      - name: Upload blocklist.bin as CI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: esp32-blocklist-bin
          path: ${{ inputs.output_name || 'blocklist.bin' }}
          retention-days: 14

      - name: Publish to 'latest' GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUT_FILE: ${{ inputs.output_name || 'blocklist.bin' }}
        run: |
          TAG="latest"
          # Create the 'latest' release if it doesn't exist yet, otherwise overwrite the binary asset
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" "$OUT_FILE" \
              --title "Latest Compiled Blocklist" \
              --notes "Automated daily build of the 40-bit FNV-1a hash blob for the ESP32-C3 ad-blocker."
          else
            gh release upload "$TAG" "$OUT_FILE" --clobber
            gh release edit "$TAG" \
              --notes "Automated build updated on $(date -u '+%Y-%m-%d %H:%M UTC')."
          fi
