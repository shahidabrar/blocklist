name: Update and Deploy Adblock Lists

on:
  schedule:
    - cron: '0 4 * * *'  # Runs daily at 04:00 UTC
  workflow_dispatch:      # Allows manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run list aggregation script
        run: python update_lists.py

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: adblock-lists
          path: output/

      - name: Commit and Push Updated Lists
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Move output files to root or a dedicated lists folder if desired
          mkdir -p lists
          cp output/* lists/
          
          git add lists/
          if git status --porcelain | grep lists; then
            git commit -m "Auto-update adblock lists [skip ci]"
            git push
          else
            echo "No changes detected in adblock lists."
          fi
