name: Build Blocklist

on:
  schedule:
    - cron: '0 2 * * *'  # daily 2AM UTC
  workflow_dispatch:  # manual button
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests

      - run: python build.py

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: auto-${{ github.run_number }}
          name: Blocklist ${{ github.run_number }} - $(date +%Y-%m-%d)
          body_path: stats.txt
          files: |
            blocklist.txt
            blocklist.txt.gz
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update latest tag
        run: |
          git tag -f latest
          git push -f origin latest
