name: Build Blocklist

on:
  schedule:
    - cron: '0 2 * * *'  # daily 2AM UTC
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install requests

      - run: python build.py

      - name: Commit to repo root
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add blocklist.txt blocklist.txt.gz stats.txt
          # only commit if changed
          if git diff --staged --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "update blocklist $(date -u +%Y-%m-%d) - $(cat stats.txt | grep Domains)"
          git push
